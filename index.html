        function renderProducts() {
            const grid = document.getElementById('products-grid');
            const search = document.getElementById('search-input').value.toLowerCase();
            const brand = document.getElementById('brand-filter').value;
            const sort = document.getElementById('sort-select').value;

            let filtered = rawProducts.filter(p => {
                const matchesSearch = p.title.toLowerCase().includes(search) || p.category.toLowerCase().includes(search);
                const matchesBrand = brand === "" || p.brand === brand;
                return matchesSearch && matchesBrand;
            });

            if (sort === "price-asc") filtered.sort((a,b) => a.price - b.price);
            if (sort === "price-desc") filtered.sort((a,b) => b.price - a.price);

            grid.innerHTML = filtered.map(p => `
                <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden flex flex-col justify-between product-card transition duration-200">
                    <img src="${p.image}" onerror="this.src='https://picsum.photos/400/400?random=${p.id}'" alt="${p.title}" class="w-full h-48 object-cover">
                    <div class="p-4 flex-grow flex flex-col justify-between space-y-3">
                        <div>
                            <span class="text-xs bg-teal-50 text-teal-700 px-2 py-1 rounded-md font-semibold">${p.brand}</span>
                            <h4 class="font-bold text-gray-800 mt-2 text-sm leading-6">${p.title}</h4>
                            <p class="text-xs text-gray-500 mt-1">${p.volume}</p>
                        </div>
                        <div class="flex justify-between items-center pt-3 border-t">
                            <span class="font-black text-teal-700 text-sm">${p.price.toLocaleString('fa-IR')} تومان</span>
                            <button onclick="addToCart(${p.id})" class="bg-teal-700 hover:bg-teal-800 text-white text-xs font-bold px-3 py-2 rounded-xl transition">
                                <i class="fa-solid fa-plus ml-1"></i> افزودن
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function addToCart(id) {
            const item = rawProducts.find(p => p.id === id);
            const inCart = cart.find(c => c.id === id);
            if(inCart) { inCart.qty++; } else { cart.push({...item, qty: 1}); }
            updateCart();
        }

        function updateCart() {
            const badge = document.getElementById('cart-badge');
            const totalCount = cart.reduce((acc, item) => acc + item.qty, 0);
            badge.innerText = totalCount;
            badge.classList.toggle('hidden', totalCount === 0);

            const container = document.getElementById('cart-items');
            container.innerHTML = cart.map(item => `
                <div class="flex justify-between items-center bg-gray-50 p-3 rounded-xl border">
                    <div>
                        <h5 class="font-bold text-xs">${item.title}</h5>
                        <span class="text-teal-700 text-xs font-bold">${(item.price * item.qty).toLocaleString('fa-IR')} تومان</span>
                    </div>
                    <div class="flex items-center space-x-2 space-x-reverse">
                        <button onclick="changeQty(${item.id}, 1)" class="w-6 h-6 bg-gray-200 rounded-md font-bold text-xs">+</button>
                        <span class="text-xs font-bold">${item.qty}</span>
                        <button onclick="changeQty(${item.id}, -1)" class="w-6 h-6 bg-gray-200 rounded-md font-bold text-xs">-</button>
                    </div>
                </div>
            `).join('');

            const total = cart.reduce((acc, item) => acc + (item.price * item.qty), 0);
            document.getElementById('cart-total').innerText = total.toLocaleString('fa-IR') + ' تومان';
        }

        function changeQty(id, delta) {
            const item = cart.find(c => c.id === id);
            if(item) {
                item.qty += delta;
                if(item.qty <= 0) cart = cart.filter(c => c.id !== id);
            }
            updateCart();
        }

        function toggleCart() {
            const drawer = document.getElementById('cart-drawer');
            const bg = document.getElementById('cart-drawer-bg');
            drawer.classList.toggle('-translate-x-full');
            bg.classList.toggle('hidden');
        }

        function checkoutWhatsApp() {
            if(cart.length === 0) return alert('سبد خرید شما خالی است.');
            let msg = "سلام! قصد ثبت سفارش زیر را دارم:\n\n";
            cart.forEach(item => { msg += `• ${item.title} (تعداد: ${item.qty})\n`; });
            const total = cart.reduce((acc, item) => acc + (item.price * item.qty), 0);
            msg += `\nجمع فاکتور: ${total.toLocaleString('fa-IR')} تومان`;
            window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`, '_blank');
        }

        function checkoutTelegram() {
            if(cart.length === 0) return alert('سبد خرید شما خالی است.');
            let msg = "سلام! قصد ثبت سفارش زیر را دارم:\n\n";
            cart.forEach(item => { msg += `• ${item.title} (تعداد: ${item.qty})\n`; });
            const total = cart.reduce((acc, item) => acc + (item.price * item.qty), 0);
            msg += `\nجمع فاکتور: ${total.toLocaleString('fa-IR')} تومان`;
            window.open(`https://t.me/${TELEGRAM_USERNAME}?text=${encodeURIComponent(msg)}`, '_blank');
        }

        renderProducts();
    </script>
